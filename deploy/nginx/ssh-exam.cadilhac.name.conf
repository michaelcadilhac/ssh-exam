# Included by nginx's http context from /etc/nginx/servers.d/.
map $http_upgrade $ssh_exam_connection_upgrade {
    default upgrade;
    '' close;
}
log_format ssh_exam_safe '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
    listen 80;
    listen [::]:80;
    server_name ssh-exam.cadilhac.name;
    access_log /var/log/nginx/ssh-exam-access.log ssh_exam_safe;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 308 https://ssh-exam.cadilhac.name$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ssh-exam.cadilhac.name;
    ssl_certificate /etc/letsencrypt/live/cadilhac.name-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cadilhac.name-0002/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/ssh-exam-access.log ssh_exam_safe;
    client_max_body_size 12m;
    client_body_timeout 30s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy 'camera=(self), fullscreen=(self), display-capture=(self), microphone=(), clipboard-read=(), clipboard-write=()' always;
    location ~ "^/api/agent/submissions/[a-f0-9-]{36}$" {
        client_max_body_size 128m;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ssh_exam_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
