# Included in each exam server {}; never shared with an unrelated virtual host.
proxy_intercept_errors on;
error_page 502 504 =503 @ssh_exam_unavailable;
location @ssh_exam_unavailable {
    default_type "";
    add_header Content-Type $ssh_exam_maintenance_type always;
    add_header Retry-After 60 always;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy 'camera=(self), fullscreen=(self), display-capture=(self), microphone=(), clipboard-read=(), clipboard-write=()' always;
    return 503 $ssh_exam_maintenance_body;
}
