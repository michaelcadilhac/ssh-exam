# Included in http {}; scripts/render-rollout-nginx bundles both maintenance parts.
map $uri $ssh_exam_maintenance_type {
    default "text/html; charset=utf-8";
    ~^/api/ "application/json; charset=utf-8";
}
map $uri $ssh_exam_maintenance_body {
    default '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam website temporarily unavailable</title><style>body{font:1rem/1.6 system-ui,sans-serif;margin:0;color:#172033;background:#f4f6f9}main{box-sizing:border-box;max-width:38rem;margin:12vh auto;padding:2rem}h1{font-size:clamp(1.5rem,5vw,2rem);line-height:1.2}a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 1rem;border-radius:.4rem;background:#254e8c;color:white;text-decoration:none}a:focus-visible{outline:3px solid #172033;outline-offset:4px}</style></head><body><main><h1>Exam website is temporarily unavailable</h1><p>Please try again shortly. If your exam was already running, its countdown continues.</p><a href="">Try again</a></main></body></html>';
    ~^/api/ '{"error":"The exam website is temporarily unavailable. Please try again shortly. If your exam was already running, its countdown continues.","code":"SERVICE_UNAVAILABLE"}';
}
