# The gate login shell is mandatory: ForceCommand executes via the account shell.
# ForceCommand applies on EVERY session channel, including old ControlMaster transports.
# Never exempt localhost, EXAM_ID or browser flags; no internal-sftp bypass.
# All additional SSH listeners must apply this policy.
# Linux OpenSSH, /etc/ssh/sshd_config.d/60-exam.conf. Verify inclusion and Match scope.
# The external subsystem must be configured globally in sshd_config, not in Match:
# Subsystem sftp /usr/lib/openssh/sftp-server
# PermitUserEnvironment no
# AcceptEnv LANG LC_* (never LD_PRELOAD, BASH_ENV, ENV or arbitrary names)
Match Group exam-managed
    ForceCommand exam-dispatch
    PermitUserRC no
    DisableForwarding yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY yes
    MaxSessions 8
Match all
