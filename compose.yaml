name: exam-workspace
services:
  app:
    image: ${EXAM_IMAGE:-ssh-exam-workspace:1.0.0}
    build: .
    init: true
    user: "10001:10001"
    environment:
      EXAM_CONFIG: /run/config/config.json
      NODE_ENV: production
    ports:
      - "127.0.0.1:${EXAM_HOST_PORT:-3000}:3000"
    volumes:
      - ./var/production:/data
      - ./deploy/config:/run/config:ro
      - ./deploy/trust:/run/trust:ro
      - ./deploy/mail:/run/mail:ro
    secrets:
      - gateway_signing_key
      - smtp_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 4g
    cpus: 4
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }
secrets:
  gateway_signing_key:
    file: ./deploy/secrets/gateway-signing.key
  smtp_password:
    file: ./deploy/secrets/smtp-password
